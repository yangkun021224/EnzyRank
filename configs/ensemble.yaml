    - I4_lightgbm_te
    - I4_lightgbm_te3
    - I4_ridge
    - I4_extratrees
    - I4_lightgbm_retr
    - I2_crossattn_prott5
    - I2_crossattn_prott5_s123
    - I2_crossattn_corr_prott5
    - I2_crossattn_corr_prott5_s123
    - I2_crossattn_corr_prott5_s456
    - I2_crossattn_corr_prott5_s789
  kcat_km:
