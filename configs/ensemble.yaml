# V2 final per-parameter stacked ensemble (leakage-free per-fold NNLS stack).
# Members from baseline_v1_oof/ (v1) and results/oof/ (V2 new).
# V2-new members:
#   I2_crossattn_corr_prott5[_s123/_s456/_s789]  correlation-aligned NN (N2), 4 seeds
